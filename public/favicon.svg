<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#1a1c20"/>
  <!-- W with upward arrow motif on right stroke, neon green with glow -->
  <g stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- W shape: left V, middle V, right stroke extends up into arrow -->
    <path d="M12 18 L20 44 L28 24 L36 44 L44 24"/>
    <!-- Arrow head on the right stroke -->
    <path d="M44 24 L44 14 M40 18 L44 14 L48 18"/>
  </g>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
